name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests eval

      - name: Test
        env:
          LLM_PROVIDER: fake
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Evaluation harness
        env:
          LLM_PROVIDER: fake
        run: python eval/run_eval.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-jobhunt-copilot .
