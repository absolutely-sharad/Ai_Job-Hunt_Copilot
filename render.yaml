# One-click deploy: https://render.com/deploy — or connect the repo in the dashboard.
services:
  - type: web
    name: ai-jobhunt-copilot
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_API_KEY
        sync: false          # set this in the Render dashboard, never in git
      - key: API_KEY
        generateValue: true  # protects the deployed API
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: CHROMA_PATH
        value: /srv/data/chroma
      - key: DATABASE_URL
        value: sqlite:////srv/data/copilot.db
    disk:
      name: copilot-data
      mountPath: /srv/data
      sizeGB: 1
